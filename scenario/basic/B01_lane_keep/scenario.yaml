schema_version: 1

scenario:
  id: B01
  category: basic
  name: lane_keep
  description: 직선 구간 차로 유지 및 기본 경로 추종
  file: B01_lane_keep.xml
  format: vtd_native
  map: LivingLAB

runtime:
  simulator: VTD
  simulator_version: "2025.2"

route:
  default: route.csv
  mode: packaged
  compatible_routes: []

validation:
  ego_control: external
  start_position_tolerance_m: 2.0
  start_heading_tolerance_deg: 10.0

parameters:
  ego_speed_mps:
    type: float
    unit: m/s
    default: 0.0

entities:
  - name: Ego
    type: vehicle
    role: ego

events: []

expected_outcomes:
  - follow_route
  - maintain_lane
  - reach_goal

evaluation:
  codes:
    - S2.1.01
  required_metrics:
    - ego_speed
    - lateral_error
    - goal_reached
    - command_steering
  thresholds_status: pending
