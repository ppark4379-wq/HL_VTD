schema_version: 1

scenario:
  id: V05
  category: vehicle
  name: cut_in_delay
  description: 정지 차량이 지연 후 Ego 전방으로 끼어드는 상황 대응
  file: V05_cut_in_delay.xml
  format: vtd_native
  map: LivingLAB

runtime:
  simulator: VTD
  simulator_version: "2025.2"

route:
  default: route.csv
  mode: packaged
  compatible_routes: []

validation:
  ego_control: external
  start_position_tolerance_m: 2.0
  start_heading_tolerance_deg: 10.0

parameters:
  ego_speed_mps:
    type: float
    unit: m/s
    default: 0.0

  trigger_distance_m:
    type: float
    unit: m
    default: 8.0

  lane_change_direction:
    type: int
    default: 1

  lane_change_duration_s:
    type: float
    unit: s
    default: 5.0

  action_delay_s:
    type: float
    unit: s
    default: 1.5

entities:
  - name: Ego
    type: vehicle
    role: ego

  - name: "New Player"
    type: vehicle
    role: relevant_object

  - name: "New Player01"
    type: vehicle
    role: obstacle_candidate

events:
  - name: delayed_vehicle_cut_in
    subject: "New Player"
    trigger:
      type: relative_distance
      reference: Ego
      threshold_parameter: trigger_distance_m
    action:
      type: lane_change
      direction_parameter: lane_change_direction
      duration_parameter: lane_change_duration_s
      delay_parameter: action_delay_s

expected_outcomes:
  - detect_relevant_object
  - detect_cut_in
  - decelerate_if_needed
  - avoid_collision

evaluation:
  codes:
    - internal.dynamic_vehicle_cut_in
  required_metrics:
    - relevant_object_id
    - object_gap
    - relative_speed
    - ttc
    - ego_speed
    - target_accel
    - collision
  thresholds_status: pending
