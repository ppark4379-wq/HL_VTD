schema_version: 1

scenario:
  id: V08
  category: vehicle
  name: side_vehicle
  description: 옆 차선 차량의 급정지 상황 대응
  file: V08_side_vehicle.xml
  format: vtd_native
  map: LivingLAB

runtime:
  simulator: VTD
  simulator_version: "2025.2"

route:
  default: route.csv
  mode: packaged
  compatible_routes: []

validation:
  ego_control: external
  start_position_tolerance_m: 3.0
  start_heading_tolerance_deg: 10.0

parameters:
  ego_speed_mps:
    type: float
    unit: m/s
    default: 0.0

  side_vehicle_speed_mps:
    type: float
    unit: m/s
    default: 4.1666666667

  trigger_distance_m:
    type: float
    unit: m
    default: 18.0

entities:
  - name: Ego
    type: vehicle
    role: ego

  - name: "New Player01"
    type: vehicle
    role: relevant_object

  - name: "New Player"
    type: vehicle
    role: obstacle_candidate

events:
  - name: side_vehicle_sudden_stop
    subject: "New Player01"
    trigger:
      type: relative_distance
      reference: Ego
      threshold_parameter: trigger_distance_m
    action:
      type: speed_change
      target_speed_mps: 0.0

expected_outcomes:
  - detect_relevant_object
  - maintain_safe_distance
  - decelerate_if_needed
  - avoid_collision

evaluation:
  codes:
    - internal.dynamic_side_vehicle_stop
  required_metrics:
    - relevant_object_id
    - object_gap
    - relative_speed
    - ttc
    - ego_speed
    - target_accel
    - collision
  thresholds_status: pending
