schema_version: 1

scenario:
  id: V04
  category: vehicle
  name: cut_in
  description: 옆 차선 차량의 Ego 전방 끼어들기 대응
  file: V04_cut_in.xml
  format: vtd_native
  map: LivingLAB

runtime:
  simulator: VTD
  simulator_version: "2025.2"

route:
  default: route.csv
  mode: packaged
  compatible_routes: []

validation:
  ego_control: external
  start_position_tolerance_m: 2.0
  start_heading_tolerance_deg: 10.0

parameters:
  ego_speed_mps:
    type: float
    unit: m/s
    default: 0.0

  lead_speed_mps:
    type: float
    unit: m/s
    default: 4.166666666666667

  trigger_distance_m:
    type: float
    unit: m
    default: 40.0

  lane_change_direction:
    type: int
    default: -1

  lane_change_duration_s:
    type: float
    unit: s
    default: 3.5

  action_delay_s:
    type: float
    unit: s
    default: 4.5

entities:
  - name: Ego
    type: vehicle
    role: ego

  - name: LeadVehicle
    type: vehicle
    role: relevant_object

events:
  - name: vehicle_cut_in
    subject: LeadVehicle
    trigger:
      type: relative_distance
      reference: Ego
      threshold_parameter: trigger_distance_m
    action:
      type: lane_change
      direction_parameter: lane_change_direction
      duration_parameter: lane_change_duration_s
      delay_parameter: action_delay_s

expected_outcomes:
  - detect_relevant_object
  - detect_cut_in
  - decelerate_if_needed
  - avoid_collision

evaluation:
  codes:
    - internal.dynamic_vehicle_cut_in
  required_metrics:
    - relevant_object_id
    - object_gap
    - relative_speed
    - ttc
    - ego_speed
    - target_accel
    - collision
  thresholds_status: pending
