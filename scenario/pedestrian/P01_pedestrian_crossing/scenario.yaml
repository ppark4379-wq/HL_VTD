schema_version: 1

scenario:
  id: P01
  category: pedestrian
  name: pedestrian_crossing
  description: 전방 보행자 횡단 대응
  file: P01_pedestrian_crossing.xml
  format: vtd_native
  map: LivingLAB

runtime:
  simulator: VTD
  simulator_version: "2025.2"

route:
  default: route.csv
  mode: packaged
  compatible_routes: []

validation:
  ego_control: external
  start_position_tolerance_m: 2.0
  start_heading_tolerance_deg: 10.0

parameters:
  ego_speed_mps:
    type: float
    unit: m/s
    default: 0.0

  trigger_distance_m:
    type: float
    unit: m
    default: 34.0

  pedestrian_speed_mps:
    type: float
    unit: m/s
    default: 1.2999999523162842

  action_delay_s:
    type: float
    unit: s
    default: 0.0

entities:
  - name: Ego
    type: vehicle
    role: ego

  - name: "New Character"
    type: pedestrian
    role: relevant_object

events:
  - name: pedestrian_crossing
    subject: "New Character"
    trigger:
      type: relative_distance
      reference: Ego
      threshold_parameter: trigger_distance_m
    action:
      type: pedestrian_motion
      speed_parameter: pedestrian_speed_mps
      delay_parameter: action_delay_s
      path_shape_id: 1

expected_outcomes:
  - detect_pedestrian
  - decelerate
  - avoid_collision

evaluation:
  codes:
    - internal.dynamic_pedestrian_crossing
  required_metrics:
    - object_gap
    - relative_speed
    - ttc
    - ego_speed
    - target_accel
    - collision
  thresholds_status: pending
