schema_version: 1

scenario:
  id: M03
  category: mixed
  name: curve_mixed_hazards
  description: LivingLAB 곡선 경로에서 다중 차량의 가속·급정지·차선변경, 보행자 횡단과 정적 장애물 대응을 함께 검증
  file: M03.xml
  format: vtd_native
  map: LivingLAB

runtime:
  simulator: VTD
  simulator_version: "2025.2"

route:
  default: route.csv
  mode: packaged
  compatible_routes: []
  # 대회 제공 checkpoint CSV이므로 XML의 Ego 시작 좌표로 덮어쓰지 않는다.
  preserve_checkpoint_coordinates: true
  # OpenDRIVE lane graph가 checkpoint 4 부근에서 인도 방향 lane을 선택한다.
  # 네 번째 checkpoint에서 다섯 번째 checkpoint까지는 VTD PathShape의
  # 직선 형상을 유지한다.
  linear_checkpoint_segments:
    - 4

validation:
  ego_control: external
  start_position_tolerance_m: 2.0
  start_heading_tolerance_deg: 10.0

parameters:
  ego_speed_mps:
    type: float
    unit: m/s
    default: 0.0

entities:
  - name: Ego
    type: vehicle
    role: ego
    initial_position:
      x: 1412.5735168457031
      y: 930.1541748046875
      z: 52.923731967
      heading_rad: 3.7242880922485893

  - name: "New Player"
    type: vehicle
    role: relevant_object
    initial_route:
      path_id: 4
      start_s_m: 15.199068515575263
      target_s_m: 320.8678620107337
      start_lane: 4

  - name: "New Player01"
    type: vehicle
    role: relevant_object
    initial_route:
      path_id: 2
      start_s_m: 0.0
      target_s_m: 927.6397067125134
      start_lane: 2

  - name: "New Player02"
    type: vehicle
    role: relevant_object
    initial_path_shape:
      path_shape_id: 5
      start_s_m: 0.01
      target_s_m: 205.10790718228196

  - name: "New Player03"
    type: vehicle
    role: relevant_object
    initial_path_shape:
      path_shape_id: 4
      start_s_m: 0.01
      target_s_m: 321.56147097243343

  - name: "New Character"
    type: pedestrian
    role: relevant_object

  - name: "New Object"
    type: obstacle
    role: wheel_stack

  - name: "New Object Copy "
    type: obstacle
    role: wheel_stack

  - name: "New Object Copy 01"
    type: obstacle
    role: wheel_stack

  - name: "New Object01"
    type: obstacle
    role: traffic_cone
    initial_position:
      x: 937.7726440429688
      y: 654.7439575195312
      z: 41.06204889974157

  - name: "New Object01 Copy "
    type: obstacle
    role: traffic_cone
    initial_position:
      x: 938.077880859375
      y: 653.9345703125
      z: 41.05803440921919

  - name: "New Object01 Copy 01"
    type: obstacle
    role: traffic_cone
    initial_position:
      x: 938.6881713867188
      y: 653.2446899414062
      z: 41.06666182330494

events:
  - name: player_accelerates
    subject: "New Player"
    trigger:
      type: relative_distance
      reference: Ego
      threshold_m: 14.0
    action:
      type: speed_change
      target_speed_mps: 5.0
      rate_mps2: 4.0

  - name: player_changes_lane
    subject: "New Player"
    trigger:
      type: relative_distance
      reference: Ego
      threshold_m: 7.0
    action:
      type: lane_change_and_autonomous
      lane_change_direction: 1
      duration_s: 3.0
      autonomous_delay_s: 7.0

  - name: player01_accelerates
    subject: "New Player01"
    trigger:
      type: relative_distance
      reference: Ego
      threshold_m: 18.0
    action:
      type: speed_change
      target_speed_mps: 8.333333333333334
      rate_mps2: 4.0

  - name: player01_changes_lane
    subject: "New Player01"
    trigger:
      type: relative_distance
      reference: Ego
      threshold_m: 10.0
    action:
      type: lane_change_and_autonomous
      lane_change_direction: -1
      duration_s: 3.0
      autonomous_delay_s: 6.0

  - name: player01_stops_at_position
    subject: "New Player01"
    trigger:
      type: absolute_position
      x: 1095.7475174790393
      y: 737.7388732943339
      radius_m: 9.0
    action:
      type: speed_change
      target_speed_mps: 0.0
      rate_mps2: 4.0

  - name: player02_accelerates
    subject: "New Player02"
    trigger:
      type: relative_distance
      reference: Ego
      threshold_m: 24.0
    action:
      type: speed_change
      target_speed_mps: 6.944444444444445
      rate_mps2: 4.0

  - name: player02_stops_at_position
    subject: "New Player02"
    trigger:
      type: absolute_position
      x: 798.0447082519531
      y: 580.562744140625
      radius_m: 13.0
    action:
      type: speed_change
      target_speed_mps: 0.0
      rate_mps2: 4.0
      autonomous_delay_s: 7.0

  - name: player03_accelerates
    subject: "New Player03"
    trigger:
      type: relative_distance
      reference: Ego
      threshold_m: 17.0
    action:
      type: speed_change
      target_speed_mps: 5.555555555555555
      rate_mps2: 4.0

  - name: player03_changes_lane
    subject: "New Player03"
    trigger:
      type: absolute_position
      x: 786.9752502441406
      y: 494.61541748046875
      radius_m: 8.0
    action:
      type: lane_change
      lane_change_direction: 1
      duration_s: 3.0

  - name: pedestrian_crossing
    subject: "New Character"
    trigger:
      type: relative_distance
      reference: Ego
      threshold_m: 23.0
    action:
      type: pedestrian_motion
      speed_mps: 2.2555556297302246
      path_shape_id: 3

expected_outcomes:
  - follow_curved_reference_path
  - detect_dynamic_vehicles
  - respond_to_cut_in_and_braking
  - detect_pedestrian
  - detect_static_obstacles
  - avoid_collision
  - reach_route_end

evaluation:
  codes:
    - internal.mixed_curve_vehicle_obstacle
  required_metrics:
    - relevant_object_id
    - object_gap
    - relative_speed
    - ttc
    - ego_speed
    - lateral_error
    - target_accel
    - collision
    - route_progress
  thresholds_status: pending
