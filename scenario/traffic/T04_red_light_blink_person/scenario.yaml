schema_version: 1

scenario:
  id: T04
  category: traffic
  name: red_light_blink_person
  description: 적색점멸 신호 구간에서 횡단하는 보행자 대응
  file: T04_red_light_blink_person.xml
  format: vtd_native
  map: LivingLAB

runtime:
  simulator: VTD
  simulator_version: "2025.2"

route:
  default: route.csv
  mode: packaged
  compatible_routes: []

validation:
  ego_control: external
  start_position_tolerance_m: 2.0
  start_heading_tolerance_deg: 10.0

parameters:
  ego_speed_mps:
    type: float
    unit: m/s
    default: 0.0

  trigger_distance_m:
    type: float
    unit: m
    default: 12.0

  pedestrian_speed_mps:
    type: float
    unit: m/s
    default: 1.7000000476837158

  action_delay_s:
    type: float
    unit: s
    default: 0.0

entities:
  - name: Ego
    type: vehicle
    role: ego

  - name: "New Character"
    type: pedestrian
    role: relevant_object

events:
  - name: flashing_red_pedestrian_crossing
    subject: "New Character"
    trigger:
      type: relative_distance
      reference: Ego
      threshold_parameter: trigger_distance_m
    action:
      type: pedestrian_motion
      speed_parameter: pedestrian_speed_mps
      delay_parameter: action_delay_s
      path_shape_id: 1

expected_outcomes:
  - detect_flashing_red
  - detect_pedestrian
  - stop_or_decelerate
  - avoid_collision
  - resume_after_clear

evaluation:
  codes:
    - internal.flashing_red_pedestrian_crossing
  required_metrics:
    - traffic_light_state
    - relevant_object_id
    - object_gap
    - ego_speed
    - target_accel
    - collision
  thresholds_status: pending
