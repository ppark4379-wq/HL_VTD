# HL FMA LivingLab 지도별 정적 규칙.
map:
  xodr: src/data/map/HL_FMA_VTD_LivingLab.xodr
  static_features: config/maps/living_lab.generated.yaml
  # VTD에서 측정한 46개 원본 좌표. 실행 경로 가까이에 투영되는 점들을
  # route_s 구간으로 묶어 해당 시나리오의 보호구역으로 활성화한다.
  school_zone_reference_points: config/maps/living_lab_school_zone_points.yaml

# 운영측 좌표를 받으면 채운다. 완료 지점은 정지점이 아니라 통과선이다.
finish:
  x: 0.0
  y: 0.0
  route_s: 0.0
  configured: false

# 보호구역(붉은 노면) 구간과 그 밖의 구간 제한속도.
# XODR에 표준 <speed>도 붉은 노면 object도 없다. 전체 object 이름을 확인했고
# 붉은 노면을 나타내는 항목은 존재하지 않는다. 직접 측정해서 채워야 한다.
#
# 참고: extract_static_zones가 찾은 노면 제한속도 표시 위치
#   route_s 593.9  30 km/h  (roadmark_speed_30.flt)
#   route_s 635.8  30 km/h  (roadmark_speed_30.flt)
#   -> 이후 50 km/h 표시가 없으므로 보호구역이 경로 끝까지 이어질 가능성이 있다.
#
# 수동 구간이 있으면 아래 배열에 추가한다. 배열이 비어 있어도 위 46개
# 측정점과 현재 route.csv가 교차하면 런타임에 보호구역을 자동 생성한다.
speed_zones: []
# speed_zones:
#   - id: school_zone_1
#     speed_limit_kph: 25.0
#     route_s_begin: 590.0
#     route_s_end: 816.0

stop_lines: []
crosswalks: []
# state=6 패킷 자체에는 점멸 색이 없다. VTD Scenario에서 적색점멸로
# 설정한 신호의 controller id(=패킷 trafficLight.id)만 red로 등록한다.
traffic_lights: []

# 실제 값을 받으면 빈 배열 대신 아래 형식으로 작성한다.
# polygon은 "x,y; x,y; x,y; x,y" 형식이며 route_s는 reference path 누적거리다.
# speed_zones 는 두 가지 방식을 지원한다. 주행 구간은 route_s 범위가 간단하다.
#   - id: school_1
#     speed_limit_kph: 27.0
#     route_s_begin: 590.0
#     route_s_end: 700.0
#   - id: parking_lot
#     speed_limit_kph: 18.0
#     polygon: "0,0; 10,0; 10,10; 0,10"
